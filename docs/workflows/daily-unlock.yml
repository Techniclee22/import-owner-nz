# STAGED COPY: move to .github/workflows/daily-unlock.yml (the box token may lack the `workflow` scope).
name: Daily Publish Unlock

on:
  schedule:
    - cron: '5 11 * * *'   # 00:05 NZDT (UTC+13); 23:05 UTC in NZST, i.e. the next 11:05 run covers it
    - cron: '5 12 * * *'   # 00:05 NZST (UTC+12) / 01:05 NZDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Git
        run: |
          git config user.name "Dash"
          git config user.email "lmcclymont@gmail.com"
      - name: Update daily unlock file and push (triggers a Vercel rebuild so due posts go live)
        run: |
          TODAY=$(TZ='Pacific/Auckland' date +%Y-%m-%d)
          echo "$TODAY" > scripts/.daily-unlock
          git add scripts/.daily-unlock
          git commit -m "chore: daily publish unlock $TODAY" || { echo "nothing to commit"; exit 0; }
          git push origin main
